        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

gin:0 0 14px;font-size:13px;color:oklch(0.5 0.015 260);text-wrap:pretty\">{{ syncDetalle }}<\u002Fp>\n\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleAvz }}\" style=\"border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:12px;font-weight:600;padding:10px 14px;border-radius:999px;cursor:pointer;color:oklch(0.5 0.015 260)\" style-hover=\"background:oklch(0.96 0.015 40)\">{{ avzLabel }}<\u002Fbutton>\n\n            <sc-if value=\"{{ avanzado }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:14px\">\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:4px\">Project URL<\u002Fspan>\n                <input value=\"{{ cfg.url }}\" sc-camel-on-change=\"{{ cfgUrl }}\" placeholder=\"https://xxxx.supabase.co\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:16px;color:oklch(0.22 0.01 260)\">\n              <\u002Flabel>\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:4px\">Anon key (pública)<\u002Fspan>\n                <input value=\"{{ cfg.key }}\" sc-camel-on-change=\"{{ cfgKey }}\" placeholder=\"eyJhbGciOi…\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:16px;color:oklch(0.22 0.01 260)\">\n              <\u002Flabel>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button type=\"button\" sc-camel-on-click=\"{{ conectar }}\" style=\"border:0;border-radius:999px;padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg, oklch(0.53 0.15 36), oklch(0.62 0.14 40))\">{{ conectarLabel }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ subirTodo }}\" style=\"border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:13px;font-weight:600;padding:12px 16px;border-radius:999px;cursor:pointer;color:oklch(0.22 0.01 260)\" style-hover=\"background:oklch(0.96 0.015 40)\">Subir lo local a la nube<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ desconectar }}\" style=\"border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:13px;font-weight:600;padding:12px 16px;border-radius:999px;cursor:pointer;color:oklch(0.5 0.015 260)\" style-hover=\"background:oklch(0.96 0.015 40)\">Desconectar<\u002Fbutton>\n\n                <button type=\"button\" sc-camel-on-click=\"{{ vaciarTodo }}\" style=\"border:1px solid oklch(0.3 0.06 168);background:#fff;font-size:13px;font-weight:600;padding:12px 16px;border-radius:999px;cursor:pointer;color:oklch(0.3 0.06 168)\">Vaciar todo<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:oklch(0.5 0.14 34);min-height:16px\">{{ syncMsg }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;border-top:1px solid oklch(0.94 0.005 260);padding-top:14px\">\n              <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.5 0.015 260);margin-bottom:8px\">Preparar la base una sola vez<\u002Fdiv>\n              <p style=\"margin:0 0 10px;font-size:13px;color:oklch(0.5 0.015 260);text-wrap:pretty\">Copiá este SQL y pegalo en el SQL Editor de tu proyecto Supabase. Crea las dos tablas con las columnas que usa la app.<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button type=\"button\" sc-camel-on-click=\"{{ copiarSql }}\" style=\"border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:999px;cursor:pointer;color:oklch(0.22 0.01 260)\" style-hover=\"background:oklch(0.96 0.015 40)\">Copiar el SQL<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ verSql }}\" style=\"border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:999px;cursor:pointer;color:oklch(0.22 0.01 260)\" style-hover=\"background:oklch(0.96 0.015 40)\">{{ verSqlLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ sqlVisible }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:12px\">\n                  <p style=\"margin:0 0 8px;font-size:12px;color:oklch(0.5 0.015 260);text-wrap:pretty\">Si el botón de copiar no funciona, seleccioná todo el texto de acá y copialo a mano.<\u002Fp>\n                  <textarea readonly=\"readonly\" value=\"{{ sqlTexto }}\" rows=\"10\" style=\"width:100%;padding:9px 12px;border-radius:13px;border:1px solid oklch(0.92 0.005 260);background:oklch(0.972 0.005 130);font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:12px;line-height:1.55;color:oklch(0.22 0.01 260);resize:vertical\"><\u002Ftextarea>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid oklch(0.92 0.005 260);border-radius:22px;padding:18px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ togIcal }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left\">\n              <span style=\"font-size:15px;font-weight:700\">Traer reservas de Airbnb<\u002Fspan>\n              <span style=\"flex:none;font-size:18px;color:oklch(0.5 0.015 260);line-height:1\">{{ icIcal }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ abIcal }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:12px 0 12px;font-size:13px;color:oklch(0.5 0.015 260);text-wrap:pretty\">Airbnb publica el calendario de cada anuncio como un enlace iCal. Es la vía que habilita sin ser partner certificado: trae las fechas y el nombre o código de la reserva; los montos los completás vos.<\u002Fp>\n            <ul style=\"margin:0 0 14px;padding-left:20px;font-size:13px;color:oklch(0.5 0.015 260);display:flex;flex-direction:column;gap:6px\">\n              <li>Airbnb: Calendario del anuncio → Disponibilidad → Sincronizar calendarios → Exportar calendario.<\u002Fli>\n              <li>Airbnb no manda el monto, así que las reservas entran sin precio y lo cargás vos.<\u002Fli>\n              <li>Los bloqueos manuales entran igual que una reserva, sin monto: los podés borrar.<\u002Fli>\n              <li>Los períodos de más de 45 noches se ignoran, porque son bloqueos de temporada.<\u002Fli>\n              <li>Booking quedó afuera: su calendario exporta disponibilidad en bloques, sin nombre ni monto, así que esas reservas se cargan a mano.<\u002Fli>\n            <\u002Ful>\n            <div style=\"border:1px solid oklch(0.92 0.005 260);border-radius:16px;padding:14px;margin-bottom:16px;background:oklch(0.982 0.004 120)\">\n              <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:oklch(0.5 0.015 260);margin-bottom:11px\">Los calendarios de Airbnb<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:{{ colsFeeds }};gap:10px\">\n                <label style=\"display:block\">\n                  <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:4px\">Bristol · Airbnb<\u002Fspan>\n                  <input value=\"{{ feeds.ba }}\" sc-camel-on-change=\"{{ fFeedBA }}\" placeholder=\"https://www.airbnb.com/calendar/ical/…\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:15px;color:oklch(0.22 0.01 260)\">\n                <\u002Flabel>\n                <label style=\"display:block\">\n                  <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:4px\">Lamadrid · Airbnb<\u002Fspan>\n                  <input value=\"{{ feeds.la }}\" sc-camel-on-change=\"{{ fFeedLA }}\" placeholder=\"https://www.airbnb.com/calendar/ical/…\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:15px;color:oklch(0.22 0.01 260)\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <label style=\"display:block;margin-top:10px\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:4px\">Proxy propio (opcional, recomendado)<\u002Fspan>\n                <input value=\"{{ proxy }}\" sc-camel-on-change=\"{{ fProxy }}\" placeholder=\"https://xxxx.supabase.co/functions/v1/ical\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:15px;color:oklch(0.22 0.01 260)\">\n              <\u002Flabel>\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleAuto }}\" style=\"margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;border:1px solid {{ autoBd }};background:{{ autoBg }};border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left\">\n                <span style=\"flex:none;width:20px;height:20px;border-radius:6px;border:2px solid {{ autoBd }};background:{{ autoCheck }};display:grid;place-items:center;color:#fff;font-size:12px;line-height:1\">{{ autoTick }}<\u002Fspan>\n                <span style=\"flex:1;min-width:0\">\n                  <span style=\"display:block;font-size:13px;font-weight:600;color:{{ autoFg }}\">Sincronizar solo <span style=\"font-weight:500;color:oklch(0.5 0.015 260)\">(recomendado)<\u002Fspan><\u002Fspan>\n                  <span style=\"display:block;font-size:12px;color:oklch(0.5 0.015 260)\">Al abrir la app y cada 15 minutos mientras esté abierta.<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:12px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ guardarFeeds }}\" style=\"border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:999px;cursor:pointer;color:oklch(0.22 0.01 260)\" style-hover=\"background:oklch(0.96 0.015 40)\">Guardar enlaces<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ sincronizarFeeds }}\" style=\"border:0;border-radius:999px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg, oklch(0.53 0.15 36), oklch(0.62 0.14 40))\">{{ syncFeedLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:oklch(0.5 0.14 34);margin-top:10px;min-height:16px;text-wrap:pretty\">{{ syncFeedMsg }}<\u002Fdiv>\n              <sc-if value=\"{{ hayImportadas }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:6px;border:1px solid oklch(0.92 0.005 260);border-radius:14px;background:#fff;overflow:hidden\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border-bottom:1px solid oklch(0.95 0.005 260)\">\n                    <span style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.5 0.015 260)\">Reservas que se agregaron<\u002Fspan>\n                    <button type=\"button\" sc-camel-on-click=\"{{ cerrarImportadas }}\" style=\"border:0;background:transparent;font-size:12px;font-weight:600;color:oklch(0.5 0.14 34);cursor:pointer;padding:2px 4px\">Ocultar<\u002Fbutton>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ importadas }}\" as=\"i\" hint-placeholder-count=\"1\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ i.abrir }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;border-bottom:1px solid oklch(0.96 0.005 260);padding:10px 13px;cursor:pointer;text-align:left\" style-hover=\"background:oklch(0.98 0.005 260)\">\n                      <span style=\"flex:none;width:8px;height:8px;border-radius:999px;background:{{ i.color }}\"><\u002Fspan>\n                      <span style=\"flex:1;min-width:0\">\n                        <span style=\"display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ i.txt }}<\u002Fspan>\n                        <span style=\"display:block;font-size:12px;color:oklch(0.5 0.015 260);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ i.sub }}<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font-size:12px;color:oklch(0.5 0.015 260);margin-top:8px;text-wrap:pretty\">Sin proxy propio el navegador suele bloquear la descarga. Si falla, cargalos con el importador de Excel.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-size:12px;color:oklch(0.5 0.14 34);margin-top:10px;min-height:16px\">{{ icalMsg }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid oklch(0.92 0.005 260);border-radius:22px;padding:18px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ togExcel }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left\">\n              <span style=\"font-size:15px;font-weight:700\">Cargar reservas pasadas desde Excel<\u002Fspan>\n              <span style=\"flex:none;font-size:18px;color:oklch(0.5 0.015 260);line-height:1\">{{ icExcel }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ abExcel }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:12px 0 12px;font-size:13px;color:oklch(0.5 0.015 260);text-wrap:pretty\">Seleccioná las filas en tu Excel, copialas (Ctrl+C) y pegalas acá. Una fila por reserva, en este orden de columnas:<\u002Fp>\n            <div style=\"font-size:12px;font-family:ui-monospace,monospace;background:oklch(0.968 0.005 130);border-radius:12px;padding:11px 13px;margin-bottom:12px;color:oklch(0.4 0.012 260);overflow-x:auto;white-space:nowrap\">depto · plataforma · huesped · ingreso · salida · dolares · cotizacion · ars · huespedes · mascotas · cobrado · limpieza hecha · limpieza · monto articulos · descripcion articulos · notas<\u002Fdiv>\n            <ul style=\"margin:0 0 14px;padding-left:20px;font-size:12px;color:oklch(0.5 0.015 260);display:flex;flex-direction:column;gap:5px\">\n              <li>Fechas como 2026-01-15 o 15/01/2026.<\u002Fli>\n              <li>Si cargás USD y cotización, el ARS se calcula solo. Si ya tenés el ARS, dejá USD vacío.<\u002Fli>\n              <li>mascotas / cobrado / limpieza: si o no. Vacío cuenta como no.<\u002Fli>\n              <li>Podés pegar con la fila de títulos: se ignora.<\u002Fli>\n              <li>Se numeran con prefijo P (P1, P2…) para distinguirlas de las nuevas.<\u002Fli>\n            <\u002Ful>\n            <div style=\"margin-bottom:12px\">\n              <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:6px\">Depto de estas filas<\u002Fspan>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px\">\n                <sc-for list=\"{{ optsBulkDepto }}\" as=\"o\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"padding:11px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-bottom:12px\">\n              <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:6px\">Plataforma de estas filas<\u002Fspan>\n              <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:8px;max-width:320px\">\n                <sc-for list=\"{{ optsBulkPlat }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"padding:11px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:oklch(0.5 0.015 260);margin-top:6px\">Si la planilla trae columna de plataforma, manda la planilla.<\u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"display:block;margin-bottom:12px;max-width:320px\">\n              <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:6px\">Cotización para las filas en USD<\u002Fspan>\n              <input value=\"{{ bulkCot }}\" sc-camel-on-change=\"{{ fBulkCot }}\" inputmode=\"decimal\" placeholder=\"1495\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:16px;color:oklch(0.22 0.01 260)\">\n            <\u002Flabel>\n            <textarea value=\"{{ bulkTexto }}\" sc-camel-on-change=\"{{ fBulk }}\" rows=\"5\" placeholder=\"Plataforma\tHuesped\tingreso\tsalida\tdolares\tars\tlimpieza…\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:15px;color:oklch(0.22 0.01 260);font-family:ui-monospace,monospace;font-size:13px;resize:vertical\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:12px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ bulkPrevia }}\" style=\"border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:999px;cursor:pointer;color:oklch(0.22 0.01 260)\" style-hover=\"background:oklch(0.96 0.015 40)\">Revisar<\u002Fbutton>\n              <sc-if value=\"{{ bulkListo }}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ bulkImportar }}\" style=\"border:0;background:linear-gradient(135deg, oklch(0.53 0.15 36), oklch(0.62 0.14 40));color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;cursor:pointer\">{{ bulkBoton }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:oklch(0.5 0.14 34);margin-top:10px;min-height:16px;text-wrap:pretty\">{{ bulkMsg }}<\u002Fdiv>\n            <sc-if value=\"{{ bulkHayFilas }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto\">\n                <sc-for list=\"{{ bulkFilas }}\" as=\"b\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:10px;border:1px solid {{ b.bd }};border-radius:12px;padding:9px 12px\">\n                    <span style=\"flex:none;width:8px;height:8px;border-radius:999px;background:{{ b.color }}\"><\u002Fspan>\n                    <span style=\"flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ b.txt }}<\u002Fspan>\n                    <span style=\"flex:none;font-size:11px;font-weight:600;color:{{ b.fg }}\">{{ b.estado }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:#fff;border:1px solid oklch(0.92 0.005 260);border-radius:22px;padding:18px\">\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:6px\">Limpieza y comisión<\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:12px;color:oklch(0.5 0.015 260);text-wrap:pretty\">Se aplican a las reservas nuevas. En cada reserva se pueden cambiar igual.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:4px\">Valor de la hora ARS<\u002Fspan>\n                <input value=\"{{ conf.valorHora }}\" sc-camel-on-change=\"{{ confValorHora }}\" inputmode=\"decimal\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:16px;color:oklch(0.22 0.01 260)\">\n              <\u002Flabel>\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:4px\">Horas por servicio<\u002Fspan>\n                <input value=\"{{ conf.horas }}\" sc-camel-on-change=\"{{ confHoras }}\" inputmode=\"decimal\" placeholder=\"1,5\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005 260);background:#fff;font-size:16px;color:oklch(0.22 0.01 260)\">\n              <\u002Flabel>\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:oklch(0.5 0.015 260);margin-bottom:4px\">Administración %<\u002Fspan>\n                <input value=\"{{ conf.admPct }}\" sc-camel-on-change=\"{{ confAdmPct }}\" inputmode=\"decimal\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid oklch(0.92 0.005
