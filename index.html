  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r(--ink);margin:4px 0\"><\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <span style=\"flex:1;min-width:0;font-size:14px;font-weight:700\">Disponible hoy<\u002Fspan>\n                  <span style=\"flex:none;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--coral-hover)\">{{ cajaSaldo }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--muted);margin-top:13px;text-wrap:pretty\">Lo que no gastás queda y arranca el mes siguiente como \"Veníamos con\".<\u002Fdiv>\n            <\u002Fdiv>\n\n\n          <\u002Fdiv>\n\n          <div style=\"min-width:0;display:flex;flex-direction:column;gap:14px\">\n            <sc-if value=\"{{ hayPorCobrar }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px dashed var(--line-2);border-radius:22px;padding:16px;background:var(--panel)\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px\">\n                  <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)\">Fuera de la caja · todavía por cobrar<\u002Fdiv>\n                  <div style=\"font-size:19px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums\">{{ cajaPorCobrar }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:7px\">\n                  <sc-for list=\"{{ porCobrarDetalle }}\" as=\"p\" hint-placeholder-count=\"1\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ p.abrir }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left\" style-hover=\"background:var(--soft-2)\">\n                      <span style=\"width:8px;height:8px;flex:none;border-radius:999px;background:{{ p.color }}\"><\u002Fspan>\n                      <span style=\"flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.huesped }}<\u002Fspan>\n                      <span style=\"font-size:11px;color:var(--faint)\">{{ p.fecha }}<\u002Fspan>\n                      <span style=\"font-size:13px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums\">{{ p.monto }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--muted);margin-top:11px;text-wrap:pretty\">No está contado arriba. Entra a la caja cuando marcás la reserva como cobrada.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px\">\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:14px\">Nuevo movimiento<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-bottom:12px\">\n              <sc-for list=\"{{ tiposMov }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"flex:1;padding:10px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <label style=\"display:block;margin-bottom:10px\">\n              <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Descripción<\u002Fspan>\n              <input value=\"{{ mf.desc }}\" sc-camel-on-change=\"{{ mfDesc }}\" sc-camel-on-key-down=\"{{ mfEnter }}\" placeholder=\"Sábanas nuevas, cena, nafta…\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)\">\n            <\u002Flabel>\n            <div style=\"margin-bottom:10px\">\n              <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Departamento<\u002Fspan>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n                <sc-for list=\"{{ deptosMov }}\" as=\"o\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"padding:10px 6px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px\">\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Monto ARS<\u002Fspan>\n                <input value=\"{{ mf.monto }}\" sc-camel-on-change=\"{{ mfMonto }}\" sc-camel-on-key-down=\"{{ mfEnter }}\" inputmode=\"decimal\" placeholder=\"0\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)\">\n              <\u002Flabel>\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Fecha<\u002Fspan>\n                <input type=\"date\" value=\"{{ mf.fecha }}\" sc-camel-on-change=\"{{ mfFecha }}\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ addMov }}\" style=\"width:100%;border:0;border-radius:999px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:#F0654F\">Guardar movimiento<\u002Fbutton>\n            <div style=\"font-size:12px;color:var(--navy);margin-top:10px;min-height:16px\">{{ mfError }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--coral-hover);margin-top:6px;min-height:16px\">{{ msg }}<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAjustes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:{{ colsPanel }};gap:18px;align-items:start\">\n        <div style=\"min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">\n              <span style=\"width:9px;height:9px;border-radius:999px;background:{{ syncTono }}\"><\u002Fspan>\n              <div style=\"font-size:15px;font-weight:700\">Datos compartidos (Supabase)<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ haySesion }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:12px 14px;margin-bottom:14px\">\n                <div style=\"height:34px;width:34px;flex:none;border-radius:999px;display:grid;place-items:center;background:#F0654F;color:#fff;font-weight:700;font-size:14px\">{{ sesionInicial }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ sesionEmail }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:var(--muted)\">Sesión abierta<\u002Fdiv>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ salir }}\" style=\"flex:none;border:1px solid var(--navy);background:var(--surface);font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;color:var(--navy);white-space:nowrap\">Cerrar sesión<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <p style=\"margin:0 0 14px;font-size:13px;color:var(--muted);text-wrap:pretty\">{{ syncDetalle }}<\u002Fp>\n\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleAvz }}\" style=\"border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;padding:10px 14px;border-radius:999px;cursor:pointer;color:var(--muted)\" style-hover=\"background:var(--tint)\">{{ avzLabel }}<\u002Fbutton>\n\n            <sc-if value=\"{{ avanzado }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:14px\">\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Project URL<\u002Fspan>\n                <input value=\"{{ cfg.url }}\" sc-camel-on-change=\"{{ cfgUrl }}\" placeholder=\"https://xxxx.supabase.co\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)\">\n              <\u002Flabel>\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Anon key (pública)<\u002Fspan>\n                <input value=\"{{ cfg.key }}\" sc-camel-on-change=\"{{ cfgKey }}\" placeholder=\"eyJhbGciOi…\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)\">\n              <\u002Flabel>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button type=\"button\" sc-camel-on-click=\"{{ conectar }}\" style=\"border:0;border-radius:999px;padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:#F0654F\">{{ conectarLabel }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ subirTodo }}\" style=\"border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;padding:12px 16px;border-radius:999px;cursor:pointer;color:var(--ink)\" style-hover=\"background:var(--tint)\">Subir lo local a la nube<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ desconectar }}\" style=\"border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;padding:12px 16px;border-radius:999px;cursor:pointer;color:var(--muted)\" style-hover=\"background:var(--tint)\">Desconectar<\u002Fbutton>\n\n                <button type=\"button\" sc-camel-on-click=\"{{ vaciarTodo }}\" style=\"border:1px solid var(--navy);background:var(--surface);font-size:13px;font-weight:600;padding:12px 16px;border-radius:999px;cursor:pointer;color:var(--navy)\">Vaciar todo<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--coral-hover);min-height:16px\">{{ syncMsg }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;border-top:1px solid var(--line-soft);padding-top:14px\">\n              <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px\">Preparar la base una sola vez<\u002Fdiv>\n              <p style=\"margin:0 0 10px;font-size:13px;color:var(--muted);text-wrap:pretty\">Copiá este SQL y pegalo en el SQL Editor de tu proyecto Supabase. Crea las dos tablas con las columnas que usa la app.<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button type=\"button\" sc-camel-on-click=\"{{ copiarSql }}\" style=\"border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;padding:11px 16px;border-radius:999px;cursor:pointer;color:var(--ink)\" style-hover=\"background:var(--tint)\">Copiar el SQL<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ verSql }}\" style=\"border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;padding:11px 16px;border-radius:999px;cursor:pointer;color:var(--ink)\" style-hover=\"background:var(--tint)\">{{ verSqlLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ sqlVisible }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:12px\">\n                  <p style=\"margin:0 0 8px;font-size:12px;color:var(--muted);text-wrap:pretty\">Si el botón de copiar no funciona, seleccioná todo el texto de acá y copialo a mano.<\u002Fp>\n                  <textarea readonly=\"readonly\" value=\"{{ sqlTexto }}\" rows=\"10\" style=\"width:100%;padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:var(--panel);font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:12px;line-height:1.55;color:var(--ink);resize:vertical\"><\u002Ftextarea>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ togIcal }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left\">\n              <span style=\"font-size:15px;font-weight:700\">Traer reservas de Airbnb<\u002Fspan>\n              <span style=\"flex:none;font-size:18px;color:var(--muted);line-height:1\">{{ icIcal }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ abIcal }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:12px 0 12px;font-size:13px;color:var(--muted);text-wrap:pretty\">Airbnb publica el calendario de cada anuncio como un enlace iCal. Es la vía que habilita sin ser partner certificado: trae las fechas y el nombre o código de la reserva; los montos los completás vos.<\u002Fp>\n            <ul style=\"margin:0 0 14px;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px\">\n              <li>Airbnb: Calendario del anuncio → Disponibilidad → Sincronizar calendarios → Exportar calendario.<\u002Fli>\n              <li>Airbnb no manda el monto, así que las reservas entran sin precio y lo cargás vos.<\u002Fli>\n              <li>Los bloqueos manuales entran igual que una reserva, sin monto: los podés borrar.<\u002Fli>\n              <li>Los períodos de más de 45 noches se ignoran, porque son bloqueos de temporada.<\u002Fli>\n              <li>Booking quedó afuera: su calendario exporta disponibilidad en bloques, sin nombre ni monto, así que esas reservas se cargan a mano.<\u002Fli>\n            <\u002Ful>\n            <div style=\"border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;background:var(--panel)\">\n              <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:11px\">Los calendarios de Airbnb<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:{{ colsFeeds }};gap:10px\">\n                <label style=\"display:block\">\n                  <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Bristol · Airbnb<\u002Fspan>\n                  <input value=\"{{ feeds.ba }}\" sc-camel-on-change=\"{{ fFeedBA }}\" placeholder=\"https://www.airbnb.com/calendar/ical/…\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--ink)\">\n                <\u002Flabel>\n                <label style=\"display:block\">\n                  <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Lamadrid · Airbnb<\u002Fspan>\n                  <input value=\"{{ feeds.la }}\" sc-camel-on-change=\"{{ fFeedLA }}\" placeholder=\"https://www.airbnb.com/calendar/ical/…\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--ink)\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <label style=\"display:block;margin-top:10px\">\n                <span style=\"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px\">Proxy propio (opcional, recomendado)<\u002Fspan>\n                <input value=\"{{ proxy }}\" sc-camel-on-change=\"{{ fProxy }}\" placeholder=\"https://xxxx.supabase.co/functions/v1/ical\" style=\"width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--ink)\">\n              <\u002Flabel>\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleAuto }}\" style=\"margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;border:1px solid {{ autoBd }};background:{{ autoBg }};border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left\">\n                <span style=\"flex:none;width:20px;height:20px;border-radius:6px;border:2px solid {{ autoBd }};background:{{ autoCheck }};display:grid;place-items:center;color:#fff;font-size:12px;line-height:1\">{{ autoTick }}<\u002Fspan>\n                <span style=\"flex:1;min-width:0\">\n                  <span style=\"display:block;font-size:13px;font-weight:600;color:{{ autoFg }}\">Sincronizar solo <span style=\"font-weight:500;color:var(--muted)\">(recomendado)<\u002Fspan><\u002Fspan>\n                  <span style=\"display:block;font-size:12px;color:var(--muted)\">Al abrir la app y cada 15 minutos mientras e
